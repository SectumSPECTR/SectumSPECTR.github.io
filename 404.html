<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>PRO Творчество | Страница не найдена</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="style.css">
  <style>
    .not-found-card {
      text-align: center;
      padding: 40px 24px;
    }
    .not-found-card h1 {
      font-family: var(--font-serif);
      font-size: 2.4rem;
      margin-bottom: 12px;
      color: var(--accent-gold);
    }
    .not-found-card p {
      color: var(--text-muted);
      margin-bottom: 24px;
    }
  </style>
</head>
<body>
  <div class="ambient-background" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>
  <main class="page-container">
    <div class="card-wrapper not-found-card">
      <h1>404</h1>
      <p>Такой страницы не существует, но вы всегда можете вернуться к главной визитке.</p>
      <a href="./" class="link-btn highlight-btn" style="justify-content: center; text-decoration: none;">
        <span class="btn-label">Перейти к визитке</span>
      </a>
    </div>
  </main>
</body>
</html>
